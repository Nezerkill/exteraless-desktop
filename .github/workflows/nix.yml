name: Nix build

on:
  push:
    branches: [master, main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build
        run: nix build .#exteraless-desktop --print-build-logs --no-link --cores 4 --max-jobs 1

      - name: Flake check
        run: nix flake check --print-build-logs --cores 4 --max-jobs 1
